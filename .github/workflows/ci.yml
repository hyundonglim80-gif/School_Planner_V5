name: CI

# 푸시·PR마다 검사 → 테스트 → 빌드(check) · 규칙·자료 시험(rules-data) · 크롬 점검(chrome - P36-1), 셋이 나란히.
# main에서 모두 통과하면 firebase-hosting-merge.yml이 배포한다(P1-4).
on:
  push:
    # claude/** = 클라우드 세션(claude.ai/code)이 푸시하는 브랜치.
    # claude/request-* = 메모 요청 PR 브랜치 - PR의 CI(pull_request, main과 합친 모습)만 돈다(크롬 점검이 두 번 돌지 않게 - P36-1)
    branches: [ main, 'wip/**', 'claude/**', '!claude/request-*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: '크롬 점검을 몇 바퀴 (흔들림 찾기 - 1~10)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 함수(P8-2)의 순수 셈 - 함수 의존성은 깔지 않는다
      - name: Test functions
        run: npm run test:functions

      - name: Build
        run: npm run build

  # 규칙·자료 층(P22-6) - 에뮬레이터가 있어야 돈다. check와 나란히 돌아 그만큼만 기다린다.
  # 배포(firebase-hosting-merge.yml)는 CI 전체가 통과해야 하므로 여기가 깨져도 배포되지 않는다.
  rules-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # 에뮬레이터 파일은 firebase-tools 판마다 같다 - 받아 둔 것을 다시 쓴다
      - name: Cache emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Rules and data tests
        run: npx firebase emulators:exec --only auth,firestore --project schoolplannerv3 "npm run check:rules && npm run test:data"

  # 크롬 점검(P36-1 · P40-1) - 자주 바뀌는 화면·달력 화면의 점검 열셋을 하나씩(목록·까닭은 tools/ci-chrome.mjs · PLAN 5장 'P36-1'·'P40-1').
  # 틀리면 CI 실패 = 배포 멈춤. 메모 요청(claude-request.yml)은 PR의 이 일까지 기다렸다 합친다.
  chrome:
    runs-on: ubuntu-latest
    # 한 바퀴 6~7분(점검 열셋) - 손 실행 '몇 바퀴'(repeat)까지
    timeout-minutes: 60
    env:
      # 점검의 '오늘'·날짜 칸은 한국 시각으로 셈한다(PC와 같게) - 러너 기본은 UTC
      TZ: Asia/Seoul
      # 손 실행(workflow_dispatch)에서 고른 바퀴 수 - 푸시·PR은 한 바퀴
      REPEAT: ${{ github.event.inputs.repeat || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Cache emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      # 러너에 깔린 구글 크롬을 쓴다(probe browserOptions - /opt/google/chrome/chrome이면 channel 'chrome', 받기 없음).
      # 한글 글꼴이 없으면 글자 폭을 재는 점검이 틀린다 - 없을 때만 깐다.
      - name: Chrome and Korean font
        run: |
          google-chrome --version
          if ! fc-list :lang=ko | grep -q .; then
            sudo apt-get update -q
            sudo apt-get install -y -q fonts-noto-cjk
          fi
          fc-list :lang=ko | head -3

      - name: Chrome probes
        run: npx firebase emulators:exec --only auth,firestore --project schoolplannerv3 "node tools/ci-chrome.mjs"

      # 에뮬레이터 로그는 끝만(전체는 수백 MB가 될 수 있다 - CLAUDE.md 2장). 통로 넘침 수도 함께.
      - name: Emulator log tail
        if: always()
        run: |
          mkdir -p ci-out
          for f in firestore-debug.log firebase-debug.log; do
            [ -f "$f" ] || continue
            ls -lh "$f"
            tail -c 2000000 "$f" > "ci-out/$f"
          done
          echo "too many pending: $(grep -c 'too many pending' firestore-debug.log 2>/dev/null || echo 0)"

      - name: Upload probe output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-probes
          path: ci-out/
          retention-days: 14
