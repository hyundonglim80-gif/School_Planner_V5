name: CI

# 푸시·PR마다 검사 → 테스트 → 빌드. main에서 통과하면 firebase-hosting-merge.yml이 배포한다(P1-4).
on:
  push:
    # claude/** = 클라우드 세션(claude.ai/code)이 푸시하는 브랜치
    branches: [ main, 'wip/**', 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # 함수(P8-2)의 순수 셈 - 함수 의존성은 깔지 않는다
      - name: Test functions
        run: npm run test:functions

      - name: Build
        run: npm run build

  # 규칙·자료 층(P22-6) - 에뮬레이터가 있어야 돈다. check와 나란히 돌아 그만큼만 기다린다.
  # 배포(firebase-hosting-merge.yml)는 CI 전체가 통과해야 하므로 여기가 깨져도 배포되지 않는다.
  rules-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # 에뮬레이터 파일은 firebase-tools 판마다 같다 - 받아 둔 것을 다시 쓴다
      - name: Cache emulators
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Rules and data tests
        run: npx firebase emulators:exec --only auth,firestore --project schoolplannerv3 "npm run check:rules && npm run test:data"
