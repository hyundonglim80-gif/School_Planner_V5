<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 화면 폭 그대로 그린다(V4: width=1200 고정은 휴대폰 글자를 잘게 줄였다).
         viewport-fit=cover는 아래 탭바가 제스처 바에 가리지 않게 safe-area 값을 쓰려고. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
    <meta name="theme-color" content="#2563eb" />
    <title>School Planner V5</title>
    <!-- 화면 밝기: 그리기 전에 dark를 붙여 밝은 화면이 번쩍이지 않게 한다. 규칙은 src/app/theme.ts와 같다(키 이름을 바꾸면 둘 다). -->
    <script>
      try {
        var m = localStorage.getItem('sp5_theme');
        if (m === 'dark' || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
